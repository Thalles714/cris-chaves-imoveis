# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary and `esbuild` downloads/
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
nodeLinker: hoisted
packageImportMethod: copy
minimumReleaseAgeExclude:
  - "@supabase/auth-js@2.114.0"
  - "@supabase/functions-js@2.114.0"
  - "@supabase/postgrest-js@2.114.0"
  - "@supabase/realtime-js@2.114.0"
  - "@supabase/storage-js@2.114.0"
  - "@supabase/supabase-js@2.114.0"
