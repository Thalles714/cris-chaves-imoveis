name: ZAP baseline staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-staging
  cancel-in-progress: false

jobs:
  baseline:
    name: Passive DAST against staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pinned scan policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the pinned OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://cris-chaves-imoveis-staging.thallestleal.workers.dev
          docker_name: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j -m 3
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-staging-baseline
