name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Rebuild and test Supabase policies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up the pinned package manager
        run: npm install --global pnpm@11.19.0

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Check the Stage 2 security contract
        run: pnpm check:stage2-security

      - name: Start the local Supabase stack
        run: pnpm supabase:start

      - name: Rebuild migrations from zero
        run: pnpm db:reset

      - name: Lint the database
        run: pnpm db:lint

      - name: Run pgTAP authorization tests
        run: pnpm db:test

      - name: Verify the publication migration contract
        run: pnpm test:integration:publication

      - name: Stop the local Supabase stack
        if: always()
        run: pnpm supabase:stop

  verify:
    name: Lint, tests, build and browser checks
    # Pixel snapshots are intentionally reviewed and versioned on Windows.
    # Keep this runner aligned with the committed `*-win32.png` baselines.
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Reject secrets and personal data in runtime files
        run: node scripts/check-sensitive-data.mjs

      - name: Check the Stage 2 security contract
        run: node scripts/check-stage2-security.mjs

      - name: Check the source client/server boundary
        run: node scripts/check-client-boundaries.mjs

      - name: Set up the pinned package manager
        run: npm install --global pnpm@11.19.0

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Reject high or critical dependency vulnerabilities
        run: pnpm audit:dependencies

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check application and tests
        run: pnpm typecheck

      - name: Run unit and architecture tests
        run: pnpm test:unit:coverage

      - name: Build for Cloudflare Workers
        run: pnpm build

      - name: Inspect the browser bundle boundary
        run: pnpm check:client-boundary

      - name: Install the pinned Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run browser and accessibility checks
        run: pnpm test:e2e
